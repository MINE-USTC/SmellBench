schema_version = "1.4"
artifacts = ["/logs/artifacts"]

[task]
name = "smellbench/unjs_unstorage_dce"
version = "1.0.0"
description = "Refactor an injected dead_code_elimination smell while preserving repository behavior."
authors = [{ name = "SmellBench", email = "noreply@smellbench.local" }]
keywords = ["smellbench", "refactoring", "dead_code_elimination", "typescript"]

[metadata]
repo_name = "unstorage"
repo_url = "https://github.com/unjs/unstorage"
git_commit = "0dfd172efbe8d4375ee749b7a528b174111f7881"
language = "TypeScript"
smell_type = "dead_code_elimination"
prompt_mode = "natural"
apt_packages = ["ca-certificates","curl","git","jq","python3","xz-utils"]
test_case_count = 510
smell_checker_match_count = 0
judge_rubric_count = 10
judge_call_count = 1
judge_max_attempts_per_rubric = 3
judge_max_call_count = 3
has_ground_truth = true
score_mode = "llm_as_judge"
reward_fallback = "none"
assembly_only = true
checker_enabled = false
packaged_runtime_validated = false
unit_tests_contribute_to_reward = false

[verifier]
timeout_sec = 151200.0
user = "root"
network_mode = "public"

[agent]
timeout_sec = 10800.0

[environment]
network_mode = "public"
env = { CC_FORBIDDEN_REPO_FULL_URL = "https://github.com/unjs/unstorage", CC_FORBIDDEN_REPO_URL = "unstorage", CC_FORBIDDEN_REPO_NAME = "unstorage" }
cpus = 4
memory_mb = 8192
storage_mb = 20480
build_timeout_sec = 1800.0
