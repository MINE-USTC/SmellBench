schema_version = "1.4"
artifacts = ["/logs/artifacts"]

[task]
name = "smellbench/japaric_cross_dim"
version = "1.0.0"
description = "Refactor an injected deeply_inlined_method smell while preserving repository behavior."
authors = [{ name = "SmellBench", email = "noreply@smellbench.local" }]
keywords = ["smellbench", "refactoring", "shotgun_surgery", "rust"]

[metadata]
repo_name = "cross"
repo_url = "https://github.com/japaric/cross"
git_commit = "8c1a8aa4b661711f4b7b6ac07c2e8929ce2f7d27"
language = "Rust"
smell_type = "deeply_inlined_method"
prompt_mode = "natural"
apt_packages = ["build-essential","pkg-config","libssl-dev","cmake"]
smell_checker_match_count = 6
has_ground_truth = true
score_mode = "llm_as_judge"
unit_tests_contribute_to_reward = false

judge_rubric_count = 5

judge_call_count = 1

assembly_only = true

packaged_runtime_validated = false

[verifier]
timeout_sec = 7200.0
user = "root"
network_mode = "public"

[agent]
timeout_sec = 10800.0

[environment]
network_mode = "public"  # baseline; agent defaults to public networking
env = { CC_FORBIDDEN_REPO_FULL_URL = "https://github.com/japaric/cross", CC_FORBIDDEN_REPO_URL = "cross", CC_FORBIDDEN_REPO_NAME = "cross" }
cpus = 4
memory_mb = 8192
storage_mb = 20480
build_timeout_sec = 1800.0
