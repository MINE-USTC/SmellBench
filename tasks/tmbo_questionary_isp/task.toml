schema_version = "1.4"
artifacts = ["/logs/artifacts"]

[task]
name = "smellbench/tmbo_questionary_isp"
version = "1.0.0"
description = "Refactor an injected interface_segregation smell while preserving repository behavior."
authors = [{ name = "SmellBench", email = "noreply@smellbench.local" }]
keywords = ["smellbench", "refactoring", "interface_segregation", "python"]

[metadata]
repo_name = "questionary"
repo_url = "https://github.com/tmbo/questionary"
git_commit = "5a68c2d3e1d4ed01b9692b487349be66014db65f"
language = "Python"
smell_type = "interface_segregation"
prompt_mode = "natural"
apt_packages = ["ca-certificates","curl","git","jq","python3"]
test_case_count = 170
smell_checker_match_count = 0
judge_rubric_count = 15
judge_call_count = 1
judge_max_attempts_per_rubric = 3
judge_max_call_count = 3
has_ground_truth = true
score_mode = "llm_as_judge"
reward_fallback = "none"
assembly_only = true
checker_enabled = false
packaged_runtime_validated = false
unit_tests_contribute_to_reward = false

[verifier]
timeout_sec = 151200.0
user = "root"
network_mode = "public"

[agent]
timeout_sec = 10800.0

[environment]
network_mode = "public"
env = { CC_FORBIDDEN_REPO_FULL_URL = "https://github.com/tmbo/questionary", CC_FORBIDDEN_REPO_URL = "questionary", CC_FORBIDDEN_REPO_NAME = "questionary" }
cpus = 4
memory_mb = 8192
storage_mb = 20480
build_timeout_sec = 1800.0
