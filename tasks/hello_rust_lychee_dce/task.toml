schema_version = "1.4"
artifacts = ["/logs/artifacts"]

[task]
name = "smellbench/hello_rust_lychee_dce"
version = "1.0.0"
description = "Refactor an injected dead_code_elimination smell while preserving repository behavior."
authors = [{ name = "SmellBench", email = "noreply@smellbench.local" }]
keywords = ["smellbench", "refactoring", "god_classes", "rust"]

[metadata]
repo_name = "lychee"
repo_url = "https://github.com/hello-rust/lychee"
git_commit = "4e065481e8571d0b270c5f4e2332b74cc8342758"
language = "Rust"
smell_type = "dead_code_elimination"
prompt_mode = "explicit"
apt_packages = ["build-essential","perl"]
smell_checker_match_count = 1
has_ground_truth = true
score_mode = "llm_as_judge"
unit_tests_contribute_to_reward = false

judge_rubric_count = 4

judge_call_count = 1

assembly_only = true

packaged_runtime_validated = false

[verifier]
timeout_sec = 7200.0
user = "root"
network_mode = "public"

[agent]
timeout_sec = 10800.0

[environment]
network_mode = "public"  # baseline; agent defaults to public networking
env = { CC_FORBIDDEN_REPO_FULL_URL = "https://github.com/hello-rust/lychee", CC_FORBIDDEN_REPO_URL = "lychee", CC_FORBIDDEN_REPO_NAME = "lychee" }
cpus = 4
memory_mb = 8192
storage_mb = 20480
build_timeout_sec = 1800.0
