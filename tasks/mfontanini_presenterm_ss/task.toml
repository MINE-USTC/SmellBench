schema_version = "1.4"
artifacts = ["/logs/artifacts"]

[task]
name = "smellbench/mfontanini_presenterm_ss"
version = "1.0.0"
description = "Refactor an injected shotgun_surgery smell while preserving repository behavior."
authors = [{ name = "SmellBench", email = "noreply@smellbench.local" }]
keywords = ["smellbench", "refactoring", "interface_segregation", "rust"]

[metadata]
repo_name = "presenterm"
repo_url = "https://github.com/mfontanini/presenterm"
git_commit = "5f8add11a24af9d257fd18da48c8004dd9c516f8"
language = "Rust"
smell_type = "shotgun_surgery"
prompt_mode = "explicit"
apt_packages = []
smell_checker_match_count = 10
has_ground_truth = true
score_mode = "llm_as_judge"
unit_tests_contribute_to_reward = false

judge_rubric_count = 20

judge_call_count = 1

assembly_only = true

packaged_runtime_validated = false

[verifier]
timeout_sec = 7200.0
user = "root"
network_mode = "public"

[agent]
timeout_sec = 10800.0

[environment]
network_mode = "public"
env = { CC_FORBIDDEN_REPO_FULL_URL = "https://github.com/mfontanini/presenterm", CC_FORBIDDEN_REPO_URL = "presenterm", CC_FORBIDDEN_REPO_NAME = "presenterm" }
cpus = 4
memory_mb = 8192
storage_mb = 20480
build_timeout_sec = 1800.0
