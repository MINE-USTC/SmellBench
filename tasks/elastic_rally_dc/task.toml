schema_version = "1.4"
artifacts = ["/logs/artifacts"]

[task]
name = "smellbench/elastic_rally_dc"
version = "1.0.0"
description = "Refactor an injected data_clumps smell while preserving repository behavior."
authors = [{ name = "SmellBench", email = "noreply@smellbench.local" }]
keywords = ["smellbench", "refactoring", "data_clumps", "python"]

[metadata]
repo_name = "rally"
repo_url = "https://github.com/elastic/rally"
git_commit = "8e69bccebeee1d7debb90a4ebcf06238aae1d04c"
language = "Python"
smell_type = "data_clumps"
prompt_mode = "natural"
apt_packages = []
smell_checker_match_count = 5
has_ground_truth = true
score_mode = "llm_as_judge"
unit_tests_contribute_to_reward = false

judge_rubric_count = 4

judge_call_count = 1

assembly_only = true

packaged_runtime_validated = false

[verifier]
timeout_sec = 7200.0
user = "root"
network_mode = "public"

[agent]
timeout_sec = 10800.0

[environment]
network_mode = "public"  # baseline; agent defaults to public networking
env = { CC_FORBIDDEN_REPO_FULL_URL = "https://github.com/elastic/rally", CC_FORBIDDEN_REPO_URL = "rally", CC_FORBIDDEN_REPO_NAME = "rally" }
cpus = 4
memory_mb = 8192
storage_mb = 20480
build_timeout_sec = 1800.0
