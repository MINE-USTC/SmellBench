schema_version = "1.4"
artifacts = ["/logs/artifacts"]

[task]
name = "smellbench/ebtech_rust_algorithms_gc"
version = "1.0.0"
description = "Refactor an injected god_classes smell while preserving repository behavior."
authors = [{ name = "SmellBench", email = "noreply@smellbench.local" }]
keywords = ["smellbench", "refactoring", "deeply_inlined_method", "rust"]

[metadata]
repo_name = "rust-algorithms"
repo_url = "https://github.com/EbTech/rust-algorithms"
git_commit = "2073670c540935960849f365e1895f558fa4319d"
language = "Rust"
smell_type = "god_classes"
prompt_mode = "explicit"
apt_packages = ["pkg-config","libssl-dev","make"]
smell_checker_match_count = 5
has_ground_truth = true
score_mode = "llm_as_judge"
unit_tests_contribute_to_reward = false

judge_rubric_count = 4

judge_call_count = 1

assembly_only = true

packaged_runtime_validated = false

[verifier]
timeout_sec = 7200.0
user = "root"
network_mode = "public"

[agent]
timeout_sec = 10800.0

[environment]
network_mode = "public"  # baseline; agent defaults to public networking
env = { CC_FORBIDDEN_REPO_FULL_URL = "https://github.com/EbTech/rust-algorithms", CC_FORBIDDEN_REPO_URL = "rust-algorithms", CC_FORBIDDEN_REPO_NAME = "rust-algorithms" }
cpus = 4
memory_mb = 8192
storage_mb = 20480
build_timeout_sec = 1800.0
